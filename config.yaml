# Usage:
#   from src.common_utils import load_config
#   cfg = load_config()               # uses variants.active below
#   cfg = load_config(variant="v2")   # runtime override
# =============================================================================


paths:
  nvd_root: src/data/NVD
  yolo_output: outputs/yolo
  checkpoints_dir: outputs/checkpoints
  results_dir: outputs/results
  optuna_db: outputs/optuna/study.db
  wandb_dir: outputs/wandb
  log_dir: outputs/logs
  splits:
    train:
    - 2022-12-04 Bjenberg 02
    - 2022-12-23 Asjo 01_HD 5x stab
    - 2022-12-02 Asjo 01_stabilized
    val:
    - 2022-12-03 Nyland 01_stabilized
    test:
    - 2022-12-23 Bjenberg 02_stabilized
  domain_shift:
    light_snow:
    - 2022-12-02 Asjo 01_stabilized
    heavy_snow:
    - 2022-12-23 Bjenberg 02_stabilized

project:
  name: nvd-snow-yolov9
  group: group-10
  seed: 42
  device: cuda:0
  log_level: INFO
  
variants:
  active: v0
  v0:
    experiment: v0
    augmentation:
      use_snow_aug: false
      disable: true            # raw data: no Albumentations, no mosaic, no Ultralytics built-in augs
      standard:
        mosaic_p: 0.0
    training:
      epochs: 100
  v1:
    experiment: v1
    augmentation:
      use_snow_aug: false
    training:
      epochs: 100
  v2:
    experiment: v2
    augmentation:
      use_snow_aug: true
    training:
      epochs: 150
  v3_ds:
    experiment: v3_ds
    augmentation:
      use_snow_aug: true
    domain_shift:
      enabled: true
    training:
      epochs: 150

model:
  architecture: yolov9              # informational; weights file determines actual arch
  weights: yolov9c.pt
  yolov9_repo: third_party/yolov9   # informational; Ultralytics auto-fetches
  trainer_class: src.model.trainer.UltralyticsTrainer
  num_classes: 1
  img_size: 640
  freeze_backbone: false

training:
  epochs: 100
  batch_size: 8
  num_workers: 4
  cache: disk
  optimizer: adam
  lr: 0.001
  lrf: 0.01
  lr_scheduler: cosine              # cosine | linear
  dropout: 0.1
  warmup_epochs: 3
  weight_decay: 0.0005
  early_stopping_patience: 50
  save_every_n_epochs: 10
  val_every_n_epochs: 1             # validate every N epochs (1 = every epoch)
loss:
  box_weight: 8.925879806965067
  cls_weight: 0.5
  dfl_weight: 1.5
  focal_gamma: 0.8993475643167195   # not used for Ultralytics; kept for other frameworks
  use_pgi: true                     # YOLOv9-architecture-internal; no Ultralytics toggle
augmentation:
  use_snow_aug: false
  standard:
    horizontal_flip_p: 0.5
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    mosaic_p: 0.5
  snow:
    desaturation:
      enabled: true
      saturation_limit:
      - -0.4
      - -0.1
      p: 0.4
    blur:
      enabled: true
      blur_limit:
      - 3
      - 5
      streak_p: 0.3
      p: 0.3
    brightness_jitter:
      enabled: true
      brightness_limit:
      - -0.10
      - 0.03
      p: 0.5
    snow_overlay:
      enabled: true
      snow_point_lower: 0.15
      snow_point_upper: 0.35
      p: 0.85
    perspective:
      enabled: true
      scale:
      - 0.03
      - 0.07
      p: 0.3
    motion_blur:
      enabled: true
      blur_limit:
      - 3
      - 7
      p: 0.3
    invert:
      enabled: false
      threshold:
      - 128
      - 220
      p: 0.05
evaluation:
  iou_threshold: 0.5
  conf_threshold: 0.001
  iou_range:                        # informational; Ultralytics computes mAP[0.5:0.95:0.05] by default
  - 0.5
  - 0.95
  - 0.05
  measure_inference_speed: true
  speed_warmup_iters: 50
  speed_eval_iters: 200

tuning:
  targets:
    lr: training.lr
    lrf: training.lrf
    batch_size: training.batch_size
    box_weight: loss.box_weight
    warmup_epochs: training.warmup_epochs
  n_trials: 15
  trial_img_size: 640
  trial_fraction: 0.3
  timeout_seconds: 7200
  trial_epochs: 15
  direction: maximize
  metric: val_map50
  pruner: hyperband
  sampler: tpe
  study_name: nvd-yolov9-hp-v1
  search_space:
    lr:
    - 0.0001
    - 0.005
    batch_size:
    - 8
    - 8
    box_weight:
    - 5.0
    - 10.0
    warmup_epochs:
    - 1
    - 5
    lrf:
    - 0.001
    - 0.1
    
logging:
  wandb_project: nvd-snow-yolov9-optuna
  wandb_entity: ADL-Group-10
  log_images_every_n_epochs: 5      # no-op for Ultralytics (auto-logs val images)
  log_grad_norm: false              # no-op for Ultralytics (would need batch callback)
  watch_model: false                # if true, wandb.watch(model) is called
domain_shift:
  enabled: false
  light_snow:
    desaturation:
      enabled: true
      saturation_limit:
      - -0.3
      - -0.08
      p: 0.3
    blur:
      enabled: true
      blur_limit:
      - 3
      - 5
      p: 0.2
    brightness_jitter:
      enabled: true
      brightness_limit:
      - -0.07
      - 0.02
      p: 0.4
    snow_overlay:
      enabled: true
      snow_point_lower: 0.12
      snow_point_upper: 0.25
      p: 0.8
    perspective:
      enabled: true
      scale:
      - 0.02
      - 0.04
      p: 0.2
    motion_blur:
      enabled: true
      blur_limit:
      - 3
      - 5
      p: 0.2
    invert:
      enabled: false
      threshold:
      - 180
      - 230
      p: 0.02
  heavy_snow:
    desaturation:
      enabled: true
      saturation_limit:
      - -0.6
      - -0.3
      p: 0.6
    blur:
      enabled: true
      blur_limit:
      - 3
      - 7
      p: 0.5
    brightness_jitter:
      enabled: true
      brightness_limit:
      - -0.18
      - -0.03
      p: 0.6
    snow_overlay:
      enabled: true
      snow_point_lower: 0.30
      snow_point_upper: 0.55
      p: 0.95
    perspective:
      enabled: true
      scale:
      - 0.05
      - 0.10
      p: 0.4
    motion_blur:
      enabled: true
      blur_limit:
      - 5
      - 11
      p: 0.4
    invert:
      enabled: false
      threshold:
      - 100
      - 200
      p: 0.10
