# Usage:
#   from src.common_utils import load_config
#   cfg = load_config()               # uses variants.active below
#   cfg = load_config(variant="v2")   # runtime override
# =============================================================================

project:
  name: nvd-snow-yolov9
  group: group-10
  seed: 42
  device: cuda:0
  log_level: INFO
variants:
  active: v1
  v1:
    experiment: v1_baseline
    use_snow_aug: false
    training:
      epochs: 100
      lr: 0.00019010245319870352
  v2:
    experiment: v2_snow_aug
    use_snow_aug: true
    training:
      epochs: 100
      lr: 0.00019010245319870352
paths:
  nvd_root: /project/src/data/NVD
  yolo_output: /project/outputs/yolo
  checkpoints_dir: /project/outputs/checkpoints
  results_dir: /project/outputs/results
  optuna_db: /project/outputs/optuna/study.db
  wandb_dir: /project/outputs/wandb
  log_dir: /project/outputs/logs
  splits:
    train:
    - 2022-12-04 Bjenberg 02
    - 2022-12-23 Asjo 01_HD 5x stab
    - 2022-12-02 Asjo 01_stabilized
    val:
    - 2022-12-03 Nyland 01_stabilized
    test:
    - 2022-12-23 Bjenberg 02_stabilized
  domain_shift:
    light_snow:
    - 2022-12-02 Asjo 01_stabilized
    heavy_snow:
    - 2022-12-23 Bjenberg 02_stabilized
model:
  architecture: yolov9
  weights: yolov9-c.pt
  yolov9_repo: third_party/yolov9
  num_classes: 1
  img_size: 640
  freeze_backbone: false
training:
  epochs: 100
  batch_size: 16
  num_workers: 4
  optimizer: adam
  lr: 0.00019010245319870352
  lr_scheduler: cosine
  warmup_epochs: 3
  weight_decay: 0.0005
  early_stopping_patience: 15
  save_every_n_epochs: 10
  val_every_n_epochs: 5
loss:
  box_weight: 8.925879806965067
  cls_weight: 0.5
  dfl_weight: 1.5
  focal_gamma: 0.8993475643167195
  use_pgi: true
augmentation:
  use_snow_aug: false
  standard:
    horizontal_flip_p: 0.5
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    mosaic_p: 0.8
  snow:
    desaturation:
      enabled: true
      saturation_limit:
      - -0.6
      - -0.2
      p: 0.6
    blur:
      enabled: true
      blur_limit:
      - 3
      - 7
      streak_p: 0.3
      p: 0.5
    brightness_jitter:
      enabled: true
      brightness_limit:
      - -0.15
      - 0.05
      p: 0.7
    snow_overlay:
      enabled: true
      snow_point_lower: 0.1
      snow_point_upper: 0.3
      p: 0.4
evaluation:
  iou_threshold: 0.5
  conf_threshold: 0.25
  iou_range:
  - 0.5
  - 0.95
  - 0.05
  measure_inference_speed: true
  speed_warmup_iters: 50
  speed_eval_iters: 200
tuning:
  n_trials: 30
  timeout_seconds: 7200
  trial_epochs: 15
  direction: maximize
  metric: val_map50
  pruner: hyperband
  sampler: tpe
  study_name: nvd-yolov9-hp
  search_space:
    lr:
    - 0.0001
    - 0.01
    batch_size:
    - 8
    - 16
    - 32
    box_weight:
    - 5.0
    - 10.0
    focal_gamma:
    - 0.5
    - 2.5
    warmup_epochs:
    - 1
    - 5
logging:
  wandb_project: nvd-snow-yolov9
  wandb_entity: ADL-Group-10
  log_images_every_n_epochs: 10
  log_grad_norm: true
  watch_model: false
domain_shift:
  enabled: false
  light_snow:
    desaturation:
      enabled: true
      saturation_limit:
      - -0.3
      - -0.1
      p: 0.3
    blur:
      enabled: true
      blur_limit:
      - 3
      - 5
      p: 0.2
    brightness_jitter:
      enabled: true
      brightness_limit:
      - -0.08
      - 0.03
      p: 0.3
    snow_overlay:
      enabled: true
      snow_point_lower: 0.05
      snow_point_upper: 0.15
      p: 0.2
  heavy_snow:
    desaturation:
      enabled: true
      saturation_limit:
      - -0.8
      - -0.4
      p: 0.8
    blur:
      enabled: true
      blur_limit:
      - 5
      - 11
      p: 0.7
    brightness_jitter:
      enabled: true
      brightness_limit:
      - -0.25
      - -0.05
      p: 0.8
    snow_overlay:
      enabled: true
      snow_point_lower: 0.2
      snow_point_upper: 0.5
      p: 0.6
